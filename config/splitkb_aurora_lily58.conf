# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the OLED Display
CONFIG_ZMK_DISPLAY=y

# Explicitly force the I2C communication bus to initialize for the master screen
CONFIG_I2C=y

# Uncomment the following lines to enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# Explicitly tell ZMK to use the SPI data bus for the RGB strip to free up the OLED pins
CONFIG_WS2812_STRIP=y

# Force the external power system to initialize early
CONFIG_ZMK_EXT_POWER=y
